name: CMake build

on: [push, pull_request]

jobs:
  assertion-handler:
    name: Custom assertion handler (${{ matrix.build_type }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive
    - name: Configure tests and example with custom assertions
      run: >-
        cmake -S . -B build/assertion-handler
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -DBUILD_SHARED_LIBS=OFF
        -DSQLITE_ENABLE_ASSERT_HANDLER=ON
        -DSQLITECPP_BUILD_TESTS=ON
        -DSQLITECPP_BUILD_EXAMPLES=ON
        -DSQLITECPP_RUN_CPPCHECK=OFF
        -DSQLITECPP_RUN_CPPLINT=OFF
    - name: Build tests and example
      run: cmake --build build/assertion-handler --parallel 2
    - name: Run tests and example
      run: ctest --test-dir build/assertion-handler --verbose --output-on-failure
    - name: Configure subdirectory example with custom assertions
      run: >-
        cmake -S examples/example2 -B build/assertion-handler-example2
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -DBUILD_SHARED_LIBS=OFF
        -DSQLITE_ENABLE_ASSERT_HANDLER=ON
    - name: Build subdirectory example
      run: cmake --build build/assertion-handler-example2 --parallel 2

  build:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
        - {
            name: "Windows Latest MSVC",
            os: windows-latest,
            generator: "Visual Studio 18 2026",
            generator_options: "",
            build_type: "Debug",
            build_shared_libs: "ON",
            cc: "cl", cxx: "cl",
            extra_path: "",
          }
        - {
            name: "Windows VS2022 x86 Release Shared",
            os: windows-2022,
            generator: "Visual Studio 17 2022",
            generator_options: "-A Win32",
            build_type: "Release",
            build_shared_libs: "ON",
            cc: "cl", cxx: "cl",
            extra_path: "",
          }
        - {
            name: "Windows VS2022 x86 Release Static",
            os: windows-2022,
            generator: "Visual Studio 17 2022",
            generator_options: "-A Win32",
            build_type: "Release",
            build_shared_libs: "OFF",
            cc: "cl", cxx: "cl",
            extra_path: "",
          }
        - {
            name: "Windows Latest MinGW",
            os: windows-latest,
            generator: "MinGW Makefiles",
            generator_options: "",
            build_type: "Debug",
            build_shared_libs: "ON",
            cc: "gcc", cxx: "g++",
            extra_path: "C:\\ProgramData\\chocolatey\\lib\\mingw\\tools\\install\\mingw64\\bin",
          }
        - {
            name: "Ubuntu 24.04 GCC",
            os: ubuntu-24.04,
            generator: "Unix Makefiles",
            generator_options: "",
            build_type: "Debug",
            build_shared_libs: "ON",
            cc: "gcc", cxx: "g++",
            extra_path: "",
          }
        - {
            name: "Ubuntu 22.04 GCC",
            os: ubuntu-22.04,
            generator: "Unix Makefiles",
            generator_options: "",
            build_type: "Debug",
            build_shared_libs: "ON",
            cc: "gcc", cxx: "g++",
            extra_path: "",
          }
        - {
            name: "macOS Latest Clang",
            os: macos-latest,
            generator: "Unix Makefiles",
            generator_options: "",
            build_type: "Debug",
            build_shared_libs: "ON",
            cc: "clang", cxx: "clang++",
            extra_path: "",
          }

    steps:
    - name: Checkout ${{ github.ref_name }}
      uses: actions/checkout@v7
      with:
        submodules: recursive
    - name: set extra GITHUB_PATH ${{ matrix.config.extra_path }} (for MinGW)
      shell: bash
      run: echo "${{ matrix.config.extra_path }}" >> $GITHUB_PATH
    - name: set env CXX=${{ matrix.config.cxx }}
      shell: cmake -P {0}
      run: |
        set(ENV{CC} ${{ matrix.config.cc }})
        set(ENV{CXX} ${{ matrix.config.cxx }})
    - run: mkdir build
    - run: cmake -G "${{ matrix.config.generator }}" ${{ matrix.config.generator_options }} -DCMAKE_VERBOSE_MAKEFILE=ON -DCMAKE_BUILD_TYPE=${{ matrix.config.build_type }} -DBUILD_SHARED_LIBS=${{ matrix.config.build_shared_libs }} -DSQLITECPP_BUILD_TESTS=ON -DSQLITECPP_BUILD_EXAMPLES=ON -DSQLITECPP_RUN_CPPCHECK=OFF -DSQLITECPP_RUN_CPPLINT=OFF ..
      working-directory: build
    - run: cmake --build build --config ${{ matrix.config.build_type }}
    - run: ctest --verbose --output-on-failure --test-dir build -C ${{ matrix.config.build_type }}
