name: Quality

on: [push, pull_request]

permissions:
  contents: read

jobs:
  sanitizers:
    name: ${{ matrix.config.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        config:
        - name: AddressSanitizer
          cmake_option: SQLITECPP_USE_ASAN
          runtime_options: detect_leaks=1:halt_on_error=1
        - name: UndefinedBehaviorSanitizer
          cmake_option: SQLITECPP_USE_UBSAN
          runtime_options: print_stacktrace=1:halt_on_error=1

    steps:
    - name: Checkout ${{ github.ref_name }}
      uses: actions/checkout@v4
    - run: git submodule update --init --recursive

    - name: Configure
      env:
        CC: clang
        CXX: clang++
      run: >-
        cmake -S . -B build
        -DCMAKE_BUILD_TYPE=Debug
        -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
        -DBUILD_SHARED_LIBS=ON
        -D${{ matrix.config.cmake_option }}=ON
        -DSQLITECPP_BUILD_TESTS=ON
        -DSQLITECPP_BUILD_EXAMPLES=ON
        -DSQLITECPP_RUN_CPPCHECK=OFF
        -DSQLITECPP_RUN_CPPLINT=OFF

    - name: Verify UBSan instrumentation and linking
      if: matrix.config.cmake_option == 'SQLITECPP_USE_UBSAN'
      run: |
        python3 - <<'PY'
        import json
        import shlex
        from pathlib import Path

        entries = json.loads(Path("build/compile_commands.json").read_text())
        for target in ("SQLiteCpp", "SQLiteCpp_tests", "SQLiteCpp_example1"):
            needle = f"CMakeFiles/{target}.dir/"
            commands = [entry for entry in entries if needle in entry["command"]]
            if not commands:
                raise SystemExit(f"No compile commands found for {target}")
            for entry in commands:
                if "-fsanitize=undefined" not in shlex.split(entry["command"]):
                    raise SystemExit(f"Missing UBSan compile flag: {entry['file']}")

            link_file = Path(f"build/CMakeFiles/{target}.dir/link.txt")
            if "-fsanitize=undefined" not in shlex.split(link_file.read_text()):
                raise SystemExit(f"Missing UBSan link flag: {target}")
            print(f"Verified UBSan compile and link flags for {target}")
        PY

    - name: Build
      run: cmake --build build --config Debug

    - name: Test
      env:
        ASAN_OPTIONS: ${{ matrix.config.runtime_options }}
        UBSAN_OPTIONS: ${{ matrix.config.runtime_options }}
      run: ctest --verbose --output-on-failure --test-dir build

  cppcheck:
    name: cppcheck
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout ${{ github.ref_name }}
      uses: actions/checkout@v4
    - run: git submodule update --init --recursive

    - name: Install cppcheck
      run: sudo apt-get update && sudo apt-get install -y cppcheck

    - name: Configure
      run: >-
        cmake -S . -B build
        -DSQLITECPP_BUILD_TESTS=OFF
        -DSQLITECPP_BUILD_EXAMPLES=OFF
        -DSQLITECPP_RUN_CPPCHECK=ON
        -DSQLITECPP_RUN_CPPLINT=OFF

    - name: Run cppcheck
      run: cmake --build build --target SQLiteCpp_cppcheck
